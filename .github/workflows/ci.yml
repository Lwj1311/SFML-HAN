name: CI / Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"

jobs:
  windows:
    name: Build · Test · Package (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-cache
            build/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DHAN_DATA_DIR=assets/data/narrative
          -DHAN_ASSET_DIR=game-assets

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $pkg = "package/XuanquanDu"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item "build/Release/han_client.exe" $pkg
          Copy-Item "build/vcpkg_installed/x64-windows/bin/*.dll" $pkg
          Copy-Item "game-assets" $pkg -Recurse
          New-Item -ItemType Directory -Force -Path "$pkg/assets/data" | Out-Null
          Copy-Item "assets/data/narrative" "$pkg/assets/data/narrative" -Recurse
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "$pkg/vc_redist.x64.exe"
          Compress-Archive -Path "$pkg/*" -DestinationPath "XuanquanDu-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XuanquanDu-windows-x64
          path: XuanquanDu-windows-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: XuanquanDu-windows-x64.zip
          generate_release_notes: true
